<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Quiz da Energia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap');

  :root{
    --energy:#facc15;
    --energy-glow:#fde047;
    --purple:#6b21d0;
    --purple-light:#a855f7;
    --dark:#0a0010;
    --soft-bg:#f5f4ff;
    --border:#e2d9f3;
    --muted:#4b4565;
    --danger:#e0523a;
    --success:#2f9e5b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(255,255,255,0.5), transparent 40%),
      linear-gradient(160deg, #ffe27a 0%, #ffd600 42%, #ffc933 100%);
    color:var(--dark);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-0.02em;}

  /* Lâmpadas decorativas no fundo */
  .bulb-deco{
    position:fixed;
    pointer-events:none;
    opacity:0.5;
    animation:bulb-glow 3.2s ease-in-out infinite;
    z-index:0;
  }
  .bulb-deco.b1{top:6%;left:6%;width:56px;animation-delay:0s;}
  .bulb-deco.b2{top:14%;right:8%;width:38px;animation-delay:.6s;}
  .bulb-deco.b3{bottom:10%;left:9%;width:44px;animation-delay:1.1s;}
  .bulb-deco.b4{bottom:16%;right:10%;width:60px;animation-delay:1.6s;}
  @keyframes bulb-glow{
    0%,100%{opacity:.35;transform:translateY(0) rotate(-4deg);}
    50%{opacity:.7;transform:translateY(-8px) rotate(4deg);}
  }

  .card{
    width:100%;
    max-width:560px;
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:24px;
    box-shadow:0 25px 70px -25px rgba(107,33,208,0.4);
    padding:30px 32px 36px;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  .card::before{
    content:'';
    position:absolute;
    top:-80px;right:-80px;
    width:220px;height:220px;
    background:radial-gradient(circle, rgba(250,204,21,0.28), transparent 70%);
    pointer-events:none;
  }

  .brand-logo{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
  }
  .brand-logo svg{height:26px;width:auto;}

  /* ---------- Tela inicial ---------- */
  .screen{display:none;}
  .screen.active{display:block;animation:fade-in .35s ease both;}
  @keyframes fade-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .start-screen{text-align:center;}
  .lume-float{
    width:190px;
    margin:4px auto 18px;
    animation:lume-pop-in .85s cubic-bezier(.34,1.56,.64,1) both,
              idle-float 3.4s ease-in-out 0.85s infinite;
    filter:drop-shadow(0 14px 22px rgba(107,33,208,0.25));
  }
  @keyframes idle-float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-10px) rotate(-1.5deg);}
  }
  @keyframes lume-pop-in{
    0%{opacity:0;transform:scale(.15) translateY(60px) rotate(-25deg);}
    55%{opacity:1;transform:scale(1.12) translateY(-14px) rotate(6deg);}
    75%{transform:scale(.94) translateY(4px) rotate(-3deg);}
    100%{opacity:1;transform:scale(1) translateY(0) rotate(0deg);}
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--soft-bg);
    color:var(--purple);
    font-weight:600;
    font-size:12.5px;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:14px;
    letter-spacing:.02em;
  }
  .start-screen h1{font-size:30px;margin-bottom:10px;}
  .start-screen h1 span{color:var(--energy);-webkit-text-stroke:0.4px var(--dark);}
  .start-screen p.lead{color:var(--muted);font-size:15px;line-height:1.55;max-width:400px;margin:0 auto 22px;}

  .info-chips{display:flex;gap:12px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .chip{
    background:var(--soft-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 22px;
    min-width:100px;
  }
  .chip strong{display:block;font-family:'Sora',sans-serif;font-size:19px;color:var(--purple);}
  .chip span{font-size:12px;color:var(--muted);}

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:14px;
    padding:14px 28px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(135deg, var(--energy), var(--energy-glow));
    color:var(--dark);
    box-shadow:0 10px 24px -8px rgba(250,204,21,0.65);
    width:100%;
  }
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-outline{
    background:#fff;
    color:var(--purple);
    border:1.5px solid var(--purple-light);
  }

  /* ---------- Tela de pergunta ---------- */
  .quiz-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .progress-wrap{flex:1;}
  .progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .progress-track{height:8px;background:var(--soft-bg);border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--purple-light),var(--purple));border-radius:999px;transition:width .35s ease;}

  .timer{
    display:flex;align-items:center;justify-content:center;
    width:52px;height:52px;border-radius:50%;
    border:3px solid var(--soft-bg);
    font-family:'Sora',sans-serif;font-weight:700;font-size:14px;
    color:var(--purple);
    flex-shrink:0;
    position:relative;
  }
  .timer.warn{color:var(--danger);border-color:#fbe1db;}

  .question-box h2{font-size:19px;line-height:1.45;margin-bottom:20px;}

  .options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .option{
    display:flex;align-items:center;gap:12px;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:13px 16px;
    cursor:pointer;
    font-size:14.5px;
    color:var(--dark);
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover{border-color:var(--purple-light);}
  .option .letter{
    width:26px;height:26px;border-radius:50%;
    background:var(--soft-bg);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--purple);flex-shrink:0;
  }
  .option.selected{border-color:var(--purple);background:#f6f0ff;}
  .option.selected .letter{background:var(--purple);color:#fff;}
  .option.correct{border-color:var(--success);background:#eafaf0;}
  .option.correct .letter{background:var(--success);color:#fff;}
  .option.wrong{border-color:var(--danger);background:#fdeeeb;}
  .option.wrong .letter{background:var(--danger);color:#fff;}
  .option:disabled{cursor:default;}

  .nav-row{display:flex;justify-content:flex-end;}

  /* ---------- Resultado ---------- */
  .result-screen{text-align:center;}
  .result-lume{
    width:120px;margin:0 auto 10px;
    filter:drop-shadow(0 12px 18px rgba(107,33,208,0.22));
    animation:lume-pop-in .85s cubic-bezier(.34,1.56,.64,1) both,
              idle-float 3.4s ease-in-out 0.85s infinite;
  }
  .score-ring{
    width:150px;height:150px;border-radius:50%;
    margin:16px auto 22px;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--purple) calc(var(--pct) * 1%), var(--soft-bg) 0);
    position:relative;
  }
  .score-ring::before{
    content:'';position:absolute;inset:10px;
    background:#fff;border-radius:50%;
  }
  .score-ring .val{position:relative;font-family:'Sora',sans-serif;font-weight:700;font-size:30px;color:var(--purple);}
  .score-ring .val small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:11px;color:var(--muted);margin-top:2px;}

  .stats-row{display:flex;justify-content:center;gap:14px;margin:22px 0 26px;flex-wrap:wrap;}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .result-actions .btn{flex:1;min-width:170px;}

  /* ---------- Revisão ---------- */
  .review-item{
    text-align:left;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .review-item h3{font-size:14px;margin-bottom:8px;}
  .review-line{font-size:13px;margin-bottom:3px;color:var(--muted);}
  .review-line b{color:var(--dark);}
  .tag-ok{color:var(--success);font-weight:600;}
  .tag-bad{color:var(--danger);font-weight:600;}
  .back-btn{margin-top:6px;}
</style>
</head>

      <h2>Quiz concluído!</h2>
      <p style="color:var(--muted);font-size:14px;margin-top:6px;">Parabéns! Você concluiu o Quiz da Energia.</p>
      <div class="score-ring" id="score-ring" style="--pct:0;">
        <div class="val" id="score-val">0%</div>
      </div>
      <div class="stats-row">
        <div class="chip"><strong id="stat-total">5</strong><span>Perguntas</span></div>
        <div class="chip"><strong id="stat-correct">0</strong><span>Corretas</span></div>
        <div class="chip"><strong id="stat-time">30s</strong><span>Por pergunta</span></div>
      </div>
      <div class="result-actions">
        <button class="btn btn-outline" id="btn-review">Revisar respostas</button>

  <!-- TELA DE REVISÃO -->
  <section class="screen" id="screen-review">
    <h2 style="margin-bottom:16px;">Revisão das respostas</h2>
    <div id="review-list"></div>
    <button class="btn btn-outline back-btn" id="btn-back-result">Voltar ao resultado</button>
  </section>

</div>

<script>
const QUESTIONS = [
  {
    q: "Em uma residência típica brasileira, considerando apenas o consumo de energia elétrica, qual dos períodos abaixo costuma apresentar o maior consumo diário?",
    options: ["Entre 00h e 05h", "Entre 06h e 09h", "Entre 10h e 14h", "Entre 18h e 21h", "Entre 22h e 23h"],
    correct: 3
  },
  {
    q: "Qual dos equipamentos abaixo tende a consumir MAIS energia elétrica ao longo de um mês em uma residência, considerando um uso comum?",
    options: ["Geladeira frost free", "Máquina de lavar roupas", "Forno elétrico", "Ar-condicionado de 12.000 BTU utilizado diariamente por várias horas", "Micro-ondas"],
    correct: 3
  },
  {
    q: "Dois aparelhos possuem a mesma potência (1.500 W). Qual fator abaixo terá maior influência no consumo total de energia elétrica?",
    options: ["A marca do aparelho", "A cor do equipamento", "O tempo de utilização", "O material da tomada", "A tensão da residência (127 V ou 220 V)"],
    correct: 2
  },
  {
    q: "Qual situação abaixo representa o MAIOR desperdício de energia elétrica ao longo de um mês?",
    options: ["Deixar uma TV em modo standby continuamente", "Esquecer uma lâmpada LED de 9 W acesa durante o dia", "Utilizar o chuveiro elétrico na posição \"inverno\" por banhos longos diariamente", "Carregar o celular todas as noites", "Utilizar um ventilador por duas horas diariamente"],
    correct: 2
  },
  {
    q: "A unidade kWh (quilowatt-hora), utilizada na conta de energia, representa:",
    options: ["A potência máxima da residência", "A corrente elétrica consumida", "A quantidade de energia consumida ao longo do tempo", "A tensão fornecida pela concessionária", "A eficiência dos aparelhos elétricos"],
    correct: 2
  }
];

const LETTERS = ["A","B","C","D","E"];
const TIME_PER_QUESTION = 30;

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let timerInterval = null;
let timeLeft = TIME_PER_QUESTION;

const screens = {
  start: document.getElementById('screen-start'),
  quiz: document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result'),
  review: document.getElementById('screen-review'),
};

function replayLumeEntrance(imgId){
  const img = document.getElementById(imgId);
  if(!img) return;
  img.style.animation = 'none';
  void img.offsetWidth; // força reflow para reiniciar a animação
  img.style.animation = '';
}

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  if(name === 'start') replayLumeEntrance('lume-start-img');
  if(name === 'result') replayLumeEntrance('lume-result-img');
}

document.getElementById('btn-start').addEventListener('click', () => {
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  showScreen('quiz');
  renderQuestion();
});

document.getElementById('btn-next').addEventListener('click', () => {
  goToNext();
});

document.getElementById('btn-restart').addEventListener('click', () => {
  showScreen('start');
});

document.getElementById('btn-review').addEventListener('click', () => {
  renderReview();
  showScreen('review');
});

document.getElementById('btn-back-result').addEventListener('click', () => {
  showScreen('result');
});

function renderQuestion(){
  clearInterval(timerInterval);
  timeLeft = TIME_PER_QUESTION;

  const data = QUESTIONS[current];
  document.getElementById('q-label').textContent = `Pergunta ${current + 1} de ${QUESTIONS.length}`;
  document.getElementById('progress-fill').style.width = `${((current) / QUESTIONS.length) * 100 + (100/QUESTIONS.length)}%`;
  document.getElementById('question-text').textContent = data.q;

  const optionsWrap = document.getElementById('options');
  optionsWrap.innerHTML = '';

  data.options.forEach((optText, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${optText}</span>`;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsWrap.appendChild(btn);
  });

  document.getElementById('btn-next').disabled = answers[current] === null;
  if(answers[current] !== null){
    highlightSelection();
  }

  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      if(answers[current] === null){
        answers[current] = -1;
      }
      goToNext();
    }
  }, 1000);
}

function updateTimerDisplay(){
  const timerEl = document.getElementById('timer');
  timerEl.textContent = timeLeft;
  timerEl.classList.toggle('warn', timeLeft <= 5);
}

function selectAnswer(idx){
  answers[current] = idx;
  highlightSelection();
  document.getElementById('btn-next').disabled = false;
}

function highlightSelection(){
  const opts = document.querySelectorAll('#options .option');
  opts.forEach((el, idx) => {
    el.classList.toggle('selected', idx === answers[current]);
  });
}

function goToNext(){
  clearInterval(timerInterval);
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  const correctCount = answers.reduce((acc, ans, idx) => acc + (ans === QUESTIONS[idx].correct ? 1 : 0), 0);
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);

  document.getElementById('score-ring').style.setProperty('--pct', pct);
  document.getElementById('score-val').innerHTML = `${pct}%<small>${correctCount} de ${QUESTIONS.length}</small>`;
  document.getElementById('stat-total').textContent = QUESTIONS.length;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-time').textContent = `${TIME_PER_QUESTION}s`;

  showScreen('result');
}

function renderReview(){
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  QUESTIONS.forEach((data, idx) => {
    const userAns = answers[idx];
    const isCorrect = userAns === data.correct;
    const userAnsText = userAns === -1 || userAns === null ? 'Não respondida' : `${LETTERS[userAns]}) ${data.options[userAns]}`;
    const correctText = `${LETTERS[data.correct]}) ${data.options[data.correct]}`;

    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <h3>${idx + 1}. ${data.q}</h3>
      <div class="review-line">Sua resposta: <b class="${isCorrect ? 'tag-ok' : 'tag-bad'}">${userAnsText}</b></div>
      ${!isCorrect ? `<div class="review-line">Resposta correta: <b>${correctText}</b></div>` : ''}
    `;
    list.appendChild(item);
  });
}
</script>
